<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bite Log</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFF2EA;--back:#DCE2D5;--surf:#fff;--sunk:#E7EBE0;--ink:#20261F;--soft:#5B6355;--faint:#8B927F;--pri:#33513B;--onpri:#F3F6EE;--acc:#D8AC3E;--accink:#5B4415;--bad:#B24A3F;--line:#D7DBCF;--line2:#C1C7B6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171B16;--back:#101310;--surf:#212620;--sunk:#272C25;--ink:#EDEFE7;--soft:#ABB2A0;--faint:#767D6C;--pri:#7FA688;--onpri:#16201A;--acc:#E3BD5D;--accink:#2A200C;--bad:#E28579;--line:#33392F;--line2:#414939;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171B16;--back:#101310;--surf:#212620;--sunk:#272C25;--ink:#EDEFE7;--soft:#ABB2A0;--faint:#767D6C;--pri:#7FA688;--onpri:#16201A;--acc:#E3BD5D;--accink:#2A200C;--bad:#E28579;--line:#33392F;--line2:#414939;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--back);color:var(--ink);font-family:'Work Sans','Noto Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.dev{width:100%;max-width:390px;min-height:760px;background:var(--bg);border:1px solid var(--line2);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.scr{display:none;flex-direction:column;min-height:760px;padding:30px 22px 24px}
.scr.on{display:flex}
h1,h2{font-family:'Fraunces','Noto Serif',serif;font-weight:500;margin:0}
h1{font-size:27px;line-height:1.15}h2{font-size:21px}
p{margin:0;line-height:1.5}
.soft{color:var(--soft);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;min-height:34px}
.back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--soft);font-size:18px;cursor:pointer}
.globe{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line2);color:var(--ink);border-radius:20px;padding:7px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
label{display:block;font-size:13px;color:var(--soft);margin:0 0 6px}
input[type=text],input[type=password],input[type=number]{width:100%;font:15px inherit;font-family:inherit;padding:11px 13px;border-radius:7px;border:1px solid var(--line2);background:var(--surf);color:var(--ink);outline:none;margin-bottom:14px}
input:focus{border-color:var(--pri)}
.btn{width:100%;padding:13px;border:0;border-radius:7px;background:var(--pri);color:var(--onpri);font:600 15px inherit;font-family:inherit;cursor:pointer;text-align:center;display:block}
.btn.ghost{background:none;color:var(--pri);border:1px solid var(--line2)}
.lnk{background:none;border:0;color:var(--pri);font:600 13px inherit;font-family:inherit;cursor:pointer;padding:0}
.sw{text-align:center;margin-top:14px;font-size:13px;color:var(--soft)}
.err{background:color-mix(in srgb,var(--bad) 14%,var(--surf));color:var(--bad);font-size:13px;padding:10px 12px;border-radius:7px;margin-bottom:14px}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:auto;padding-top:18px}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:8px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:6px;font:600 13px inherit;font-family:inherit;color:var(--soft);cursor:pointer}
.seg button.on{background:var(--surf);color:var(--ink)}
.two{display:flex;gap:10px}.two>div{flex:1}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.big{font:500 34px 'Fraunces',serif}
.note{font-size:11.5px;color:var(--faint);margin-top:10px}
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 21px 'Fraunces',serif}
.ring b small{font:400 10px 'Work Sans',sans-serif;color:var(--faint)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:start;cursor:pointer;color:var(--ink);font-family:inherit;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:14.5px;display:block}.tile small{color:var(--faint);font-size:12px}
.tile.feat{grid-column:span 2;background:var(--pri);color:var(--onpri);border:0;min-height:0;gap:2px}
.tile.feat small{color:var(--onpri);opacity:.8}
.badge{background:var(--acc);color:var(--accink);font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;align-self:flex-start}
.out{margin-top:auto;padding-top:18px}
.cam{position:relative;background:#16201A;border-radius:18px;min-height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#D9DED2;font-size:13px;text-align:center;padding:20px}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam span{position:relative;background:rgba(0,0,0,.45);padding:7px 13px;border-radius:20px;color:#fff}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:8px;padding:8px 12px;margin:6px 0 12px}
.stp button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--surf);color:var(--ink);font-size:16px;cursor:pointer}
.li{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li small{display:block;color:var(--faint);font-size:12px}
.pill{background:color-mix(in srgb,var(--acc) 28%,transparent);color:var(--accink);font-weight:600;font-size:13px;border-radius:20px;padding:3px 9px;white-space:nowrap}
.li button{background:none;border:0;color:var(--faint);cursor:pointer;margin-inline-start:8px}
.bg{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;z-index:40}.bg.on{display:block}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px 24px;z-index:50;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}.sheet h2{margin-bottom:12px}
.opt{display:flex;justify-content:space-between;width:100%;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;font:500 15px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--pri)}
.toast{position:absolute;left:22px;right:22px;bottom:22px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:7px;font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}.toast.on{opacity:1}
select{width:100%;font:15px inherit;font-family:inherit;padding:11px 13px;border-radius:7px;border:1px solid var(--line2);background:var(--surf);color:var(--ink);margin-bottom:14px}
.sheet{max-height:82%;overflow:auto}
[dir=rtl] .back{transform:scaleX(-1)}
</style>
</head>
<body>
<div class="stage"><div class="dev">

<div class="scr on" id="login">
  <div class="bar"><span></span><button class="globe" data-open>🌐 <span class="cur"></span></button></div>
  <h1 data-t="welcome"></h1><p class="soft" data-t="tagline" style="margin:6px 0 26px"></p>
  <div class="err" id="err" hidden></div>
  <label data-t="user"></label><input type="text" id="un" autocomplete="username">
  <label data-t="pass"></label><input type="password" id="pw" autocomplete="current-password">
  <button class="btn" id="lgBtn" data-t="login"></button>
  <div class="sw"><span id="swTxt" data-t="noAcct"></span> <button class="lnk" id="swBtn" data-t="create"></button></div>
  <p class="hint" data-t="demo"></p>
</div>

<div class="scr" id="setup">
  <div class="bar"><button class="back" id="setBack" data-go="menu">‹</button><button class="globe" data-open>🌐 <span class="cur"></span></button></div>
  <h1 data-t="setupT"></h1><p class="soft" data-t="setupL" style="margin:6px 0 18px"></p>
  <div class="seg"><button data-unit="kg" class="on">kg</button><button data-unit="lb">lb</button></div>
  <label data-t="gender"></label><div class="seg"><button data-sex="m" class="on" data-t="male"></button><button data-sex="f" data-t="female"></button><button data-sex="o" data-t="other"></button></div>
  <div class="two"><div><label data-t="age"></label><input type="number" id="ag" min="18" max="100" inputmode="numeric"></div><div><label><span data-t="height"></span> (<span id="hu">cm</span>)</label><input type="number" id="ht" min="50" inputmode="decimal"></div></div>
  <div class="two"><div><label data-t="cur"></label><input type="number" id="cw" min="20" inputmode="decimal"></div><div><label data-t="goalw"></label><input type="number" id="gw" min="20" inputmode="decimal"></div></div>
  <label data-t="activity"></label><select id="ac"><option value="0" data-t="act1"></option><option value="1" data-t="act2"></option><option value="2" data-t="act3"></option><option value="3" data-t="act4"></option><option value="4" data-t="act5"></option></select>
  <p class="err" id="a18" data-t="age18" hidden></p>
  <div class="card" id="calc" hidden>
    <p class="soft" data-t="tgt"></p><div class="big"><span id="tv">0</span> <small style="font:500 14px 'Work Sans'">kcal / <span data-t="day"></span></small></div>
    <p class="soft" id="plan" style="margin-top:4px"></p><p class="note" data-t="simple"></p>
  </div>
  <div class="out"><button class="btn" id="saveG" data-t="save" disabled></button></div>
</div>

<div class="scr" id="menu">
  <div class="bar"><span class="soft" id="hello"></span><button class="globe" data-open>🌐 <span class="cur"></span></button></div>
  <div class="card hero" style="margin-top:0">
    <div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--sunk)" stroke-width="9"/><circle id="arc" cx="48" cy="48" r="40" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251"/></svg><b><span id="eaten">0</span><small data-t="eatenL"></small></b></div>
    <div><p class="soft" data-t="tgt"></p><div class="big" id="mt" style="font-size:28px"></div><p class="soft" id="left"></p></div>
  </div>
  <div class="tiles">
    <button class="tile feat" data-go="scan"><b data-t="scan"></b><small data-t="scanSub"></small></button>
    <button class="tile" data-go="log"><span class="badge" id="lc">0</span><span><b data-t="logT"></b><small data-t="logSub"></small></span></button>
    <button class="tile" data-go="setup"><span style="font-size:20px">🎯</span><span><b data-t="myGoal"></b><small id="gs"></small></span></button>
    <button class="tile" data-open style="grid-column:span 2;min-height:0;flex-direction:row;align-items:center"><span><b data-t="lang"></b><small id="ln"></small></span><span style="font-size:20px">🌐</span></button>
  </div>
  <div class="out"><button class="btn ghost" id="outBtn" data-t="out"></button></div>
</div>

<div class="scr" id="scan">
  <div class="bar"><button class="back" data-go="menu">‹</button><button class="globe" data-open>🌐 <span class="cur"></span></button></div>
  <h2 data-t="scan" style="margin-bottom:14px"></h2>
  <div class="cam" id="cam"><span data-t="camHint"></span></div>
  <label class="btn" style="margin-top:12px"><span data-t="photo"></span><input type="file" id="file" accept="image/*" capture="environment" hidden></label>
  <div class="sw"><button class="lnk" id="manBtn" data-t="manual"></button></div>
  <div class="card" id="res" hidden>
    <b id="rn" style="font:500 19px 'Fraunces',serif"></b><p class="note" id="rc" style="margin:2px 0 8px"></p>
    <label data-t="portion"></label>
    <div class="stp"><button id="sm">−</button><b id="sv">1</b><button id="sp">+</button></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><span class="soft" data-t="total"></span><b class="big" style="font-size:22px" id="rt"></b></div>
    <button class="btn" id="addR" data-t="add"></button><p class="note" data-t="demoNote"></p>
  </div>
  <div class="card" id="bad" hidden><b data-t="cant"></b><p class="soft" data-t="dark" style="margin-top:4px"></p></div>
  <div class="card" id="man" hidden>
    <label data-t="fname"></label><input type="text" id="mn"><label data-t="kps"></label><input type="number" id="mk" min="0">
    <button class="btn" id="addM" data-t="add"></button>
  </div>
</div>

<div class="scr" id="log">
  <div class="bar"><button class="back" data-go="menu">‹</button><button class="globe" data-open>🌐 <span class="cur"></span></button></div>
  <h2 data-t="logT" style="margin-bottom:8px"></h2><p class="soft" id="ltot"></p>
  <div id="lst" style="margin-top:10px"></div>
</div>

<div class="bg" id="bg"></div>
<div class="sheet" id="sheet"><h2 data-t="lang"></h2><div id="opts"></div></div>
<div class="toast" id="toast"></div>
</div></div>

function rLog(){var e=ents(),s=0,h='';e.forEach(function(x,i){s+=x.k*x.s;h+='<div class="li"><div>'+nm(x).replace(/</g,'&lt;')+'<small>'+new Date(x.ts).toLocaleTimeString(lang,{hour:'numeric',minute:'2-digit'})+' · '+x.s+' '+t('srv')+'</small></div><div style="display:flex;align-items:center"><span class="pill">'+Math.round(x.k*x.s)+' kcal</span><button data-del="'+i+'">✕</button></div></div>'});$('#lst').innerHTML=h||'<p class="soft">'+t('empty')+'</p>';$('#ltot').textContent=Math.round(s)+' kcal';$$('[data-del]').forEach(function(b){b.onclick=function(){ents().splice(+b.dataset.del,1);sav();rLog()}})}

$('#cw').oninput=$('#gw').oninput=$('#ag').oninput=$('#ht').oninput=rSetup;$('#ac').onchange=rSetup;
$$('[data-sex]').forEach(function(b){b.onclick=function(){sex=b.dataset.sex;$$('[data-sex]').forEach(function(x){x.classList.toggle('on',x===b)});rSetup()}});

function bad(){pend=null;hideAll();$('#bad').hidden=false;$('#cam span').textContent=t('camHint')}
$('#file').onchange=function(){var f=this.files[0];if(!f)return;hideAll();var u=URL.createObjectURL(f);$('#cam').innerHTML='<img src="'+u+'" alt=""><span>'+t('ident')+'</span>';
 var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=40;var x=c.getContext('2d');x.drawImage(im,0,0,40,40);var d,r=0,g=0,b=0;try{d=x.getImageData(0,0,40,40).data}catch(er){return bad()}for(var i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}r/=1600;g/=1600;b/=1600;
 setTimeout(function(){$('#cam span').hidden=true;if((r+g+b)/3<55)return bad();var k=g>r&&g>b&&g-Math.max(r,b)>8?'green':r>g+25&&r>b+25?'red':r>170&&g>140&&b<130?'yellow':r>g&&g>b&&r-b>10&&r<190?'brown':'neutral',a=BK[k],id=a[Math.floor(Math.random()*a.length)];pend={id:id,k:Math.round(K[id]*(0.9+Math.random()*0.2)),c:Math.round(72+Math.random()*22)};sv=1;rRes();$('#res').hidden=false},800)};im.onerror=bad;im.src=u;this.value=''};

apply(lang);
})();
